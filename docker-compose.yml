services:
  db:
    container_name: ${MONGO_DB_NAME}
    image: mongo:6.0
    volumes:
      - poke-vol:/data/db
    # ports:
    #   - 27017:27017
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command: ['--auth']
  
  mongo-express:
    depends_on:
      - db
    image: mongo-express:1.0.0-alpha.4
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: ${MONGO_DB_NAME}
    ports:
      - 8080:8081
    restart: always

  poke-app:
      depends_on:
        - db
        - mongo-express
      image: klerith/pokemon-nest-app:1.0.0
      ports:
        - 2000:3000
      environment:
        MONGODB: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_DB_NAME}:27017
        DB_NAME: ${MONGO_DB_NAME}
      restart: always  

# This docker-compose file defines a volume named "poke-vol" with external set to false.
# The volume is used to persist data for the Pokemon app.
# The volume is not external, meaning it is managed by Docker and not created outside of the compose file.
volumes:
  poke-vol:
    external: false